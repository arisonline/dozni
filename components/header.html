<style>
:root{--dozni-width:1440px;--dozni-gutter:clamp(20px,3vw,48px)}
body{font-family:var(--font-sans);font-size:var(--text-base)}.container{width:min(calc(100% - (var(--dozni-gutter) * 2)),var(--dozni-width));margin-inline:auto}.container-wide{width:min(calc(100% - (var(--dozni-gutter) * 2)),1600px);margin-inline:auto}body:not(:has(.compress-tool)) p{font-size:var(--text-lg);line-height:var(--line-relaxed)}body:not(:has(.compress-tool)) h1{font-size:clamp(var(--text-4xl),5.5vw,var(--text-6xl))}body:not(:has(.compress-tool)) h2{font-size:clamp(var(--text-3xl),4.2vw,var(--text-5xl))}body:not(:has(.compress-tool)) h3{font-size:clamp(var(--text-xl),2.3vw,var(--text-2xl))}
body > [data-component="/components/header.html"]{position:sticky;top:0;z-index:1000}
.dozni-header{position:relative;z-index:1000;width:100%;height:42px;min-height:42px;background:var(--color-bg);border-bottom:0;box-shadow:none}
.dozni-navbar{width:min(calc(100% - (var(--dozni-gutter) * 2)),var(--dozni-width));height:42px;margin:auto;padding:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.dozni-logo{justify-self:start;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--color-text);font-size:22px;font-weight:850;letter-spacing:-.045em;white-space:nowrap}.dozni-logo-mark{width:29px;height:29px;display:block;flex:none}.dozni-logo-text{color:var(--color-text)}.dozni-logo-text span{color:#635bff}
.dozni-nav{display:flex;align-items:center;justify-content:center;gap:2px;margin:0}.dozni-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 12px;border-radius:8px;color:var(--color-text-soft);text-decoration:none;font-size:var(--text-sm);font-weight:750;transition:.2s}.dozni-nav a:hover,.dozni-nav a.is-active{background:var(--color-bg-soft);color:var(--color-text)}
.dozni-nav-right{justify-self:end;display:flex;align-items:center;gap:6px}.dozni-icon-btn{width:32px;height:32px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface);color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;transition:.2s}.dozni-icon-btn:hover{background:var(--color-bg-soft);border-color:var(--color-border-strong);color:var(--color-text)}.dozni-start{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 13px;border-radius:8px;background:var(--color-text);color:var(--color-bg);text-decoration:none;font-size:var(--text-sm);font-weight:750;transition:.2s}.dozni-start:hover{background:var(--color-primary);color:var(--color-text-inverse);transform:translateY(-1px)}
.dozni-mobile{display:none}.dozni-mobile-panel{display:none}.dozni-search-overlay{position:fixed;inset:0;z-index:2000;background:rgba(15,23,42,.48);backdrop-filter:blur(7px);display:none;padding:80px 20px 30px}.dozni-search-overlay.is-open{display:block}.dozni-search-box{width:min(760px,100%);margin:auto;background:var(--color-surface);border:1px solid var(--color-border);border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden}.dozni-search-top{display:flex;align-items:center;gap:12px;padding:18px}.dozni-search-top input{flex:1;border:0;outline:0;font:inherit;font-size:var(--text-xl);color:var(--color-text);background:transparent;min-height:48px}.dozni-search-close{border:0;background:var(--color-bg-soft);border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:24px;color:var(--color-text-soft)}.dozni-search-hint{padding:0 18px 18px;color:var(--color-text-muted);font-size:var(--text-sm)}.dozni-search-form{display:flex;align-items:center;gap:10px;flex:1}.dozni-search-submit{border:0;background:var(--color-primary);color:var(--color-text-inverse);border-radius:11px;padding:12px 18px;font-size:var(--text-sm);font-weight:750;cursor:pointer}
@media(max-width:1120px){.dozni-nav a{padding:0 10px;font-size:var(--text-sm)}.dozni-start{display:none}}
@media(max-width:820px){.dozni-header{height:40px;min-height:40px}.dozni-navbar{width:calc(100% - 28px);height:40px;display:flex}.dozni-logo{font-size:21px}.dozni-logo-mark{width:28px;height:28px}.dozni-nav{display:none}.dozni-nav-right{margin-left:auto}.dozni-mobile{display:grid}.dozni-mobile-panel{border-top:1px solid var(--color-border);background:var(--color-bg)}.dozni-mobile-panel.is-open{display:block}.dozni-mobile-panel a{display:block;padding:13px 18px;color:var(--color-text-soft);text-decoration:none;font-size:var(--text-base);font-weight:700;border-bottom:1px solid var(--color-border)}.dozni-mobile-panel a:hover,.dozni-mobile-panel a.is-active{color:var(--color-text);background:var(--color-bg-soft)}}
@media(max-width:520px){body{font-size:var(--text-base)}.dozni-icon-btn{width:31px;height:31px}.dozni-icon-btn svg{width:16px;height:16px}.dozni-search-overlay{padding:60px 12px 20px}.dozni-search-top{padding:14px}.dozni-search-top input{font-size:var(--text-lg)}.dozni-search-submit{padding:12px 14px}}
</style>
