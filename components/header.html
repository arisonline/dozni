<!-- =========================================================
     DOZNI — Site Header
     File: components/header.html
     ========================================================= -->

<header class="site-header">

    <div class="container header-inner">

        <!-- Brand -->
        <a
            class="site-brand"
            href="/"
            aria-label="DOZNI Home"
        >

            <span
                class="site-brand-mark"
                aria-hidden="true"
            >
                D
            </span>

            <span class="site-brand-name">
                DOZNI
            </span>

        </a>


        <!-- Desktop Navigation -->
        <nav
            class="main-nav"
            aria-label="Primary navigation"
        >

            <ul class="main-nav-list">

                <li class="main-nav-item">
                    <a
                        class="main-nav-link"
                        href="/tools/"
                    >
                        Tools
                    </a>
                </li>

                <li class="main-nav-item">
                    <a
                        class="main-nav-link"
                        href="/crypto/"
                    >
                        Crypto
                    </a>
                </li>

                <li class="main-nav-item">
                    <a
                        class="main-nav-link"
                        href="/services/"
                    >
                        Services
                    </a>
                </li>

                <li class="main-nav-item">
                    <a
                        class="main-nav-link"
                        href="/blog/"
                    >
                        Blog
                    </a>
                </li>

            </ul>

        </nav>


        <!-- Header Actions -->
        <div class="header-actions">

            <!-- Theme Toggle -->
            <button
                class="theme-toggle"
                type="button"
                data-theme-toggle
                aria-label="Switch theme"
                title="Switch theme"
            >
                <svg
                    class="icon icon-sun"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>

                    <path
                        d="M12 2v2"
                    ></path>

                    <path
                        d="M12 20v2"
                    ></path>

                    <path
                        d="m4.93 4.93 1.41 1.41"
                    ></path>

                    <path
                        d="m17.66 17.66 1.41 1.41"
                    ></path>

                    <path
                        d="M2 12h2"
                    ></path>

                    <path
                        d="M20 12h2"
                    ></path>

                    <path
                        d="m6.34 17.66-1.41 1.41"
                    ></path>

                    <path
                        d="m19.07 4.93-1.41 1.41"
                    ></path>
                </svg>

                <svg
                    class="icon icon-moon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path
                        d="M21 12.79A9 9 0 1 1 11.21 3
                        7 7 0 0 0 21 12.79z"
                    ></path>
                </svg>

                <span class="sr-only">
                    Toggle dark mode
                </span>

            </button>


            <!-- Mobile Menu Button -->
            <button
                class="mobile-menu-button"
                type="button"
                data-mobile-menu-button
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="mobile-navigation"
            >

                <span
                    class="mobile-menu-icon"
                    aria-hidden="true"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </button>

        </div>

    </div>


    <!-- Mobile Navigation -->
    <div
        class="mobile-nav"
        id="mobile-navigation"
        data-mobile-menu
    >

        <div class="container">

            <nav
                aria-label="Mobile navigation"
            >

                <ul class="mobile-nav-list">

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/"
                        >
                            Home
                        </a>
                    </li>

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/tools/"
                        >
                            Tools
                        </a>
                    </li>

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/crypto/"
                        >
                            Crypto
                        </a>
                    </li>

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/services/"
                        >
                            Services
                        </a>
                    </li>

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/blog/"
                        >
                            Blog
                        </a>
                    </li>

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/about/"
                        >
                            About
                        </a>
                    </li>

                    <li>
                        <a
                            class="mobile-nav-link"
                            href="/contact/"
                        >
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </div>

</header>
