<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search DOZNI tools and digital resources."><link rel="canonical" href="https://dozni.com/search/"><link rel="stylesheet" href="/assets/css/global.css"><link rel="stylesheet" href="/assets/css/components.css"><link rel="stylesheet" href="/assets/css/responsive.css"><title>Search — DOZNI</title></head><body><div data-component="/components/header.html"></div><main class="section"><div class="container content-narrow"><p class="eyebrow">DOZNI Search</p><h1>Search tools & resources</h1><form id="search-page-form" style="display:flex;gap:10px;margin:28px 0"><input id="search-page-input" type="search" placeholder="Search PDF, image, calculator, JSON..." style="flex:1;padding:14px 16px;border:1px solid #dddde6;border-radius:12px;font:inherit"><button class="btn btn-primary" type="submit">Search</button></form><p id="search-count" class="section-description"></p><div id="search-results" class="tool-grid"></div></div></main><div data-component="/components/footer.html"></div><script src="/assets/js/theme.js"></script><script src="/assets/js/navigation.js"></script><script src="/assets/js/components.js"></script><script src="/assets/js/main.js"></script><script src="/assets/js/site-search.js"></script><script>const items=[['PDF Tools','Work with PDF files online.','/tools/pdf/'],['Image Tools','Resize, crop, convert and compress images.','/tools/image/'],['Calculators','Everyday calculators and conversions.','/tools/calculator/'],['Developer Tools','Useful browser tools for developers.','/tools/developer/'],['Crypto','Blockchain networks, explorers and crypto tools.','/crypto/'],['Photo Tools','Image and photo utilities.','https://photo.dozni.com/'],['Sarkari Tools','Indian government-related tools and resources.','https://sarkari.dozni.com/'],['Digital Tools','Practical online utilities from DTools.','https://dtools.dozni.com/'],['Percentage Calculator','Calculate percentages quickly.','/tools/calculator/percentage/'],['Age Calculator','Calculate age from a date of birth.','/tools/calculator/age/']];const input=document.getElementById('search-page-input'),results=document.getElementById('search-results'),count=document.getElementById('search-count'),form=document.getElementById('search-page-form');function render(q){q=(q||'').trim().toLowerCase();const found=items.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));count.textContent=q?(found.length+' result'+(found.length===1?'':'s')+' for “'+q+'”'):'Popular DOZNI resources';results.innerHTML=found.map(x=>'<a class="tool-card" href="'+x[2]+'"><div class="tool-card-icon">DOZ</div><div class="tool-card-content"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></a>').join('')||'<p>No matching resources found.</p>'}form.addEventListener('submit',e=>{e.preventDefault();render(input.value);history.replaceState(null,'','?q='+encodeURIComponent(input.value))});const q=new URLSearchParams(location.search).get('q')||'';input.value=q;render(q);</script></body></html>
